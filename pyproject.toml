[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q1d"
version = "0.0.1"
description = "Quasi-1D Euler solver with turbomachinery source terms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
# Needed only to BUILD a real-gas map (`Nasa9Gas.from_cantera`). Loading a saved
# map (`ECMFMap.load`) reconstructs the gas from the stored coefficient blocks
# and needs nothing beyond numpy.
real = ["cantera>=3.0"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marches the solver for thousands of steps; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
